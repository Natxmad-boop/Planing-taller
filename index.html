<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Taller - Planning Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #3b82f6;
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: var(--primary-color);
            border-bottom: 1px solid #334155;
        }
        .card-board {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }
        .task-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .task-card:hover {
            transform: translateY(-2px);
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border-color: #334155;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: white;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        .modal-content {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #334155;
        }
        .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="login-screen" class="container mt-5" style="max-width: 420px;">
        <div class="card card-board mt-5 p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fas fa-tools mb-2" style="font-size: 2.5rem; color: var(--secondary-color);"></i>
                    <h3 class="fw-bold">Taller Mecánico Pro</h3>
                    <p class="text-muted small">Inicia sesión para acceder al planning</p>
                </div>
                
                <div class="alert alert-secondary py-2 small mb-4" role="alert" style="background-color: #0f172a; border-color: #334155; color: #94a3b8;">
                    <i class="fas fa-info-circle me-1 text-info"></i> <strong>Acceso:</strong><br>
                    Correo: <code>taller@taller.com</code><br>
                    Contraseña: <code>taller123</code>
                </div>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label small text-uppercase fw-bold text-muted">Correo electrónico</label>
                        <input type="email" id="login-email" class="form-control" value="taller@taller.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-uppercase fw-bold text-muted">Contraseña</label>
                        <input type="password" id="login-password" class="form-control" value="taller123" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar al Sistema</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Pantalla Principal (Tablero Kanban) -->
    <div id="app-screen" class="container-fluid py-4 px-4" style="display: none;">
        <nav class="navbar navbar-dark px-4 rounded mb-4 shadow-sm">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="fas fa-car me-2 text-info"></i> Planning Taller - Sincronizado</span>
            <div class="d-flex align-items-center">
                <span class="text-muted me-3 small"><i class="fas fa-user-circle me-1"></i> taller@taller.com</span>
                <button class="btn btn-outline-light btn-sm" onclick="handleLogout()"><i class="fas fa-sign-out-alt me-1"></i> Salir</button>
            </div>
        </nav>

        <div class="row mb-4">
            <div class="col-md-12 text-end">
                <button class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#newOrderModal">
                    <i class="fas fa-plus me-1"></i> Nueva Orden / Vehículo
                </button>
            </div>
        </div>

        <!-- Columnas del Tablero -->
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card card-board h-100 border-top border-warning border-4">
                    <div class="card-body">
                        <h5 class="card-title text-warning fw-bold"><i class="fas fa-clock me-2"></i> Pendientes</h5>
                        <hr style="border-color: #334155;">
                        <div id="list-pending" class="d-flex flex-column gap-3"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card card-board h-100 border-top border-primary border-4">
                    <div class="card-body">
                        <h5 class="card-title text-primary fw-bold"><i class="fas fa-wrench me-2"></i> En Proceso</h5>
                        <hr style="border-color: #334155;">
                        <div id="list-progress" class="d-flex flex-column gap-3"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card card-board h-100 border-top border-success border-4">
                    <div class="card-body">
                        <h5 class="card-title text-success fw-bold"><i class="fas fa-check-circle me-2"></i> Finalizados</h5>
                        <hr style="border-color: #334155;">
                        <div id="list-finished" class="d-flex flex-column gap-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nueva Orden -->
    <div class="modal fade" id="newOrderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold">Registrar Nuevo Vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="order-form" onsubmit="handleAddOrder(event)">
                        <div class="mb-3">
                            <label class="form-label small text-muted fw-bold">Cliente</label>
                            <input type="text" id="client-name" class="form-control" required placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted fw-bold">Vehículo (Modelo / Matrícula)</label>
                            <input type="text" id="car-model" class="form-control" required placeholder="Ej. Seat León - 4523XYZ">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted fw-bold">Descripción de la Avería / Trabajo</label>
                            <textarea id="car-issue" class="form-control" rows="3" required placeholder="Cambio de aceite y revisión"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted fw-bold">Estado Inicial</label>
                            <select id="car-status" class="form-select">
                                <option value="pending">Pendiente</option>
                                <option value="progress">En Proceso</option>
                                <option value="finished">Finalizado</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Orden en la Nube</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica de Firebase Sincronizada -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqzUFL_4PBhpIND_CFIg8...", // (Tus claves reales configuradas)
            authDomain: "planning-taller-23a87.firebaseapp.com",
            projectId: "planning-taller-23a87",
            storageBucket: "planning-taller-23a87.appspot.com",
            messagingSenderId: "1094366720962",
            appId: "1:1094366720962:web:860ecb...",
            measurementId: "G-8B760E9RBP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let orders = [];

        window.handleLogin = function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;

            if (email === 'taller@taller.com' && pass === 'taller123') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                initRealtimeSync();
            } else {
                alert('Credenciales incorrectas. Use taller@taller.com / taller123');
            }
        }

        window.handleLogout = function() {
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
        }

        function initRealtimeSync() {
            onSnapshot(collection(db, "orders"), (snapshot) => {
                orders = [];
                snapshot.forEach((docSnap) => {
                    orders.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderOrders();
            });
        }

        function renderOrders() {
            const pendingContainer = document.getElementById('list-pending');
            const progressContainer = document.getElementById('list-progress');
            const finishedContainer = document.getElementById('list-finished');

            pendingContainer.innerHTML = '';
            progressContainer.innerHTML = '';
            finishedContainer.innerHTML = '';

            orders.forEach(order => {
                const cardHtml = `
                    <div class="task-card p-3 shadow-sm">
                        <div class="d-flex justify-content-between align-items-start">
                            <h6 class="fw-bold mb-1 text-info">${order.car}</h6>
                            <button class="btn btn-sm text-danger p-0" onclick="deleteOrder('${order.id}')" title="Eliminar"><i class="fas fa-trash"></i></button>
                        </div>
                        <p class="small text-muted mb-1"><strong>Cliente:</strong> ${order.client}</p>
                        <p class="small mb-2">${order.issue}</p>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <select class="form-select form-select-sm w-auto" onchange="updateStatus('${order.id}', this.value)">
                                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pendiente</option>
                                <option value="progress" ${order.status === 'progress' ? 'selected' : ''}>En Proceso</option>
                                <option value="finished" ${order.status === 'finished' ? 'selected' : ''}>Finalizado</option>
                            </select>
                        </div>
                    </div>
                `;

                if (order.status === 'pending') {
                    pendingContainer.innerHTML += cardHtml;
                } else if (order.status === 'progress') {
                    progressContainer.innerHTML += cardHtml;
                } else if (order.status === 'finished') {
                    finishedContainer.innerHTML += cardHtml;
                }
            });
        }

        window.handleAddOrder = async function(e) {
            e.preventDefault();
            try {
                await addDoc(collection(db, "orders"), {
                    client: document.getElementById('client-name').value,
                    car: document.getElementById('car-model').value,
                    issue: document.getElementById('car-issue').value,
                    status: document.getElementById('car-status').value,
                    createdAt: Date.now()
                });

                document.getElementById('order-form').reset();
                const modalEl = document.getElementById('newOrderModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                modal.hide();
            } catch (error) {
                alert("Error al guardar la orden: " + error.message);
            }
        }

        window.updateStatus = async function(id, newStatus) {
            try {
                const orderRef = doc(db, "orders", id);
                await updateDoc(orderRef, { status: newStatus });
            } catch (error) {
                alert("Error al actualizar: " + error.message);
            }
        }

        window.deleteOrder = async function(id) {
            if (confirm('¿Estás seguro de eliminar esta orden?')) {
                try {
                    await deleteDoc(doc(db, "orders", id));
                } catch (error) {
                    alert("Error al eliminar: " + error.message);
                }
            }
        }
    </script>
</body>
</html>
